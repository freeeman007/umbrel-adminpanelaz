version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adminpanelaz_server_1
      APP_PORT: 8000

  server:
    image: python:3.12-slim
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PYTHONUNBUFFERED: "1"
      APP_PASSWORD: ${APP_PASSWORD}
      NODE_AGENT_MTLS_DIR: /data/mtls
      NODE_AGENT_MTLS_CA_CERT: /data/mtls/ca.crt
      NODE_AGENT_MTLS_CLIENT_CERT: /data/mtls/panel.crt
      NODE_AGENT_MTLS_CLIENT_KEY: /data/mtls/panel.key
      NODE_SYNC_AUTO_HEAL: "true"
      NODE_SYNC_RECONCILE_INTERVAL_SECONDS: "600"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -eu
        APP=/data/app

        # git нужен панели для проверки/подтягивания обновлений кода,
        # iproute2/curl — для встроенной диагностики (/settings/tests)
        if ! command -v git >/dev/null 2>&1 || ! command -v ss >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
          echo "[adminpanelaz] ставлю утилиты (git/iproute2/curl)..."
          apt-get update -qq || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl iproute2 ca-certificates >/dev/null 2>&1 || true
        fi

        if [ ! -x "$$APP/backend/.venv/bin/uvicorn" ]; then
          echo "[adminpanelaz] первичная установка..."
          apt-get update -qq || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates build-essential libffi-dev >/dev/null 2>&1 || true
          rm -rf "$$APP"
          mkdir -p /data
          git clone --depth 1 https://github.com/Kirito0098/AdminPanelAZ.git "$$APP"
          cd "$$APP/backend"
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          echo "[adminpanelaz] зависимости установлены"
        fi

        # Готовый фронтенд (backend отдаёт его из frontend/dist)
        if [ ! -f "$$APP/frontend/dist/index.html" ]; then
          echo "[adminpanelaz] распаковываю фронтенд..."
          mkdir -p "$$APP/frontend"
          python3 -c "import urllib.request;urllib.request.urlretrieve('https://raw.githubusercontent.com/freeeman007/umbrel-adminpanelaz/main/adminpanelaz/frontend-dist.tar.gz','/tmp/dist.tar.gz')"
          tar -xzf /tmp/dist.tar.gz -C "$$APP/frontend"
          rm -f /tmp/dist.tar.gz
          echo "[adminpanelaz] фронтенд: $$(ls "$$APP/frontend/dist" | wc -l) файлов"
        fi

        cd "$$APP/backend"
        mkdir -p data data/cidr data/cidr/list /data/mtls
        # Node.js нужен для самообновления панели: system_update.py выполняет
        # `npm ci` и `npm run build:all`. В python:3.12-slim npm нет, из-за чего
        # «Обновить панель» падало с [Errno 2] No such file or directory: 'npm'.
        # Ставим официальный Node в /data/node (переживает перезапуск контейнера).
        NODE_PREFIX=/data/node
        if [ ! -x "$$NODE_PREFIX/bin/npm" ]; then
          case "$$(uname -m)" in
            aarch64|arm64) NODE_ARCH=arm64 ;;
            *) NODE_ARCH=x64 ;;
          esac
          NODE_VER=22.23.5
          echo "[adminpanelaz] ставлю Node.js $$NODE_VER/$$NODE_ARCH для самообновления..."
          mkdir -p "$$NODE_PREFIX"
          if curl -fsSL --retry 3 --max-time 300 -o /tmp/node.tar.gz \
               "https://nodejs.org/dist/v$$NODE_VER/node-v$$NODE_VER-linux-$$NODE_ARCH.tar.gz"; then
            tar -xzf /tmp/node.tar.gz -C /tmp
            cp -a "/tmp/node-v$$NODE_VER-linux-$$NODE_ARCH/." "$$NODE_PREFIX/"
            rm -rf /tmp/node.tar.gz "/tmp/node-v$$NODE_VER-linux-$$NODE_ARCH"
          else
            echo "[adminpanelaz] ВНИМАНИЕ: Node.js не скачался — самообновление упадёт на npm"
          fi
        fi
        export PATH="$$NODE_PREFIX/bin:$$PATH"
        command -v npm >/dev/null 2>&1 && echo "[adminpanelaz] node $$(node -v), npm $$(npm -v)"

        # «Пересобрать панель» (/api/system/rebuild) делает только npm run
        # build:all, без npm ci — на чистом контейнере падает с «vite: not found».
        # Ставим зависимости фронтенда один раз (в /data/app/frontend, переживает
        # перезапуск контейнера).
        if [ -x "$$NODE_PREFIX/bin/npm" ] && [ ! -x "$$APP/frontend/node_modules/.bin/vite" ]; then
          echo "[adminpanelaz] ставлю фронтенд-зависимости (npm ci)..."
          if ( cd "$$APP/frontend" && npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1 ); then
            echo "[adminpanelaz] фронтенд-зависимости готовы"
          else
            echo "[adminpanelaz] ВНИМАНИЕ: npm ci не удался, подробности /tmp/npm-ci.log"
            tail -5 /tmp/npm-ci.log 2>/dev/null || true
          fi
        fi

        chmod 700 /data/mtls 2>/dev/null || true

        if [ ! -f .env ]; then
          echo "[adminpanelaz] создаю конфигурацию..."
          cp .env.example .env 2>/dev/null || touch .env
          SECRET=$$(python -c "import secrets;print(secrets.token_urlsafe(48))")
          {
            echo ""
            echo "# --- сгенерировано Umbrel ---"
            echo "APP_ENV=production"
            echo "SECRET_KEY=$$SECRET"
            echo "DATABASE_URL=sqlite:////data/app/backend/data/adminpanel.db"
            echo "CIDR_DATABASE_URL=sqlite:////data/app/backend/data/cidr/cidr.db"
            echo "DEFAULT_ADMIN_USERNAME=admin"
            echo "DEFAULT_ADMIN_PASSWORD=$${APP_PASSWORD:-admin}"
            echo "DEFAULT_ADMIN_MUST_CHANGE_PASSWORD=false"
            echo "ADMIN_MUST_CHANGE_PASSWORD=false"
            echo "ENFORCE_PASSWORD_POLICY=false"
            echo "AUTH_RATE_LIMIT_BACKEND=memory"
            echo "API_RATE_LIMIT_BACKEND=memory"
            echo "UVICORN_WORKERS=1"
            echo "BACKEND_HOST=0.0.0.0"
            echo "BACKEND_PORT=8000"
            echo "SERVE_FRONTEND=true"
            echo "FRONTEND_DIST_PATH=/data/app/frontend/dist"
            echo "ALLOW_INTERNAL_NODES=true"
            echo "LOCAL_ANTIZAPRET_ENABLED=false"
            echo "CORS_ORIGINS=http://127.0.0.1:8000,http://localhost:8000"
            echo "AUTO_BACKUP_ENABLED=false"
            echo "CIDR_DB_REFRESH_ENABLED=false"
            echo "TRAFFIC_SYNC_ENABLED=false"
            echo "RESOURCE_METRICS_ENABLED=false"
            echo "TELEGRAM_ENABLED=false"
          } >> .env
        fi

        # Догоняем недостающие ключи на уже созданном .env
        grep -q '^SERVE_FRONTEND=' .env || {
          echo "SERVE_FRONTEND=true" >> .env
          echo "FRONTEND_DIST_PATH=/data/app/frontend/dist" >> .env
        }

        # Диагностика не должна падать 500, если утилиты (systemctl/nginx) нет в контейнере
        python3 -c "import urllib.request;urllib.request.urlretrieve('https://raw.githubusercontent.com/freeeman007/umbrel-adminpanelaz/main/adminpanelaz/patch-diagnostics.py','/tmp/patch-diagnostics.py')" 2>/dev/null || true
        python3 /tmp/patch-diagnostics.py 2>/dev/null || true

        # cert_sync: занятый слот узла — не ошибка, и без повального фолбэка по клиентам
        python3 -c "import urllib.request;urllib.request.urlretrieve('https://raw.githubusercontent.com/freeeman007/umbrel-adminpanelaz/main/adminpanelaz/patch-cert-sync-busy.py','/tmp/patch-cert-sync-busy.py')" 2>/dev/null || true
        python3 /tmp/patch-cert-sync-busy.py 2>/dev/null || true

        # Копирование в буфер обмена при доступе по HTTP (без secure context)
        python3 -c "import urllib.request;urllib.request.urlretrieve('https://raw.githubusercontent.com/freeeman007/umbrel-adminpanelaz/main/adminpanelaz/patch-clipboard-fallback.py','/tmp/patch-clipboard-fallback.py')" 2>/dev/null || true
        python3 /tmp/patch-clipboard-fallback.py 2>/dev/null || true

        echo "[adminpanelaz] запуск на 0.0.0.0:8000"
        exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
